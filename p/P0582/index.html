<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>P0582 | Villa S. Remigio</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f5f7f3;
            color: #263328;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 50px 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .location {
            font-size: 18px;
            letter-spacing: 2px;
            color: #55705a;
        }

        h1 {
            font-size: 38px;
            margin: 15px 0 5px 0;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .plant-code {
            font-size: 48px;
            font-weight: bold;
            color: #315b38;
            margin: 30px 0;
        }

        .message {
            font-size: 18px;
            line-height: 1.6;
            color: #555;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <div class="location">
                VILLA S. REMIGIO
            </div>

            <h1>
                Patrimonio Arboreo
            </h1>

            <div class="subtitle">
                Censimento Digitale
            </div>

            <div class="plant-code">
                P0582
            </div>

            <div class="message">
                La scheda informativa di questo esemplare
                sarà disponibile prossimamente.
            </div>

        </div>

    </div>

</body>

</html>
